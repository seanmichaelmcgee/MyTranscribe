<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Accurate medical dictation that stays on your PC"><title>Accurate medical dictation that stays on your PC</title><rect width="1200" height="630" fill="#fcfcfb"/><text x="64.0" y="96.0" font-size="40" fill="#0b0b0b" font-weight="700" text-anchor="start">Accurate medical dictation that stays on your PC</text><text x="64.0" y="138.0" font-size="20" fill="#52514e" font-weight="400" text-anchor="start">Open-source dictation built on Whisper large-v3. Word error rates similar to or better</text><text x="64.0" y="166.0" font-size="20" fill="#52514e" font-weight="400" text-anchor="start">than commercial-grade medical dictation in our testing.</text><rect x="64" y="206" width="340" height="168" rx="12" fill="#f4f3ef"/><text x="88.0" y="276.0" font-size="52" fill="#2a78d6" font-weight="700" text-anchor="start">7.0%</text><text x="88.0" y="316.0" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">word errors on real clinicians&#x27;</text><text x="88.0" y="340.0" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">dictation (Corti Med-Dictate)</text><rect x="436" y="206" width="340" height="168" rx="12" fill="#f4f3ef"/><text x="460.0" y="276.0" font-size="52" fill="#2a78d6" font-weight="700" text-anchor="start">2.1%</text><text x="460.0" y="316.0" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">word errors on the developer&#x27;s</text><text x="460.0" y="340.0" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">reading of consult letters</text><rect x="808" y="206" width="340" height="168" rx="12" fill="#f4f3ef"/><text x="832.0" y="276.0" font-size="52" fill="#0b0b0b" font-weight="700" text-anchor="start">0 bytes</text><text x="832.0" y="316.0" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">of audio or text sent</text><text x="832.0" y="340.0" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">anywhere</text><text x="64.0" y="424.0" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="start">Real clinicians, word errors (lower is better)</text><text x="404.0" y="461.0" font-size="16" fill="#52514e" font-weight="400" text-anchor="end">Whisper large-v3 on its own*</text><path d="M420.0,446.0 H930.8 Q934.8,446.0 934.8,450.0 V462.0 Q934.8,466.0 930.8,466.0 H420.0 Z" fill="#c9c7bd"/><text x="942.8" y="462.0" font-size="16" fill="#52514e" font-weight="400" text-anchor="start">14.2%</text><text x="404.0" y="501.0" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="end">MyTranscribe Medical</text><path d="M420.0,486.0 H670.1 Q674.1,486.0 674.1,490.0 V502.0 Q674.1,506.0 670.1,506.0 H420.0 Z" fill="#2a78d6"/><text x="682.1" y="502.0" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">7.0%</text><line x1="420" x2="420" y1="436" y2="516" stroke="#c3c2b7"/><line x1="56" x2="1144" y1="554" y2="554" stroke="#e1e0d9"/><text x="56.0" y="582.0" font-size="13" fill="#898781" font-weight="400" text-anchor="start">*Dictated punctuation converted. Corti Med-Dictate, 24 notes, November 2026. Windows, NVIDIA graphics card with 6 GB or more.</text><text x="56.0" y="604.0" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">MyTranscribe Medical · open source · runs on your own PC</text></svg>